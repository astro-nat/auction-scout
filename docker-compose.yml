name: auction-scout

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: htown
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: auction_scout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U htown -d auction_scout"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://htown:devpassword@postgres:5432/auction_scout
    # Dev-only override of the production CMD: live-reload, capped drain
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 5
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app   # live-reload during dev
    depends_on:
      postgres:
        condition: service_healthy

  # The background worker: same image, different command. Everything long
  # running lives here rather than in the API — see app/worker.py.
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://htown:devpassword@postgres:5432/auction_scout
    command: python -m app.worker
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started   # the API owns the schema migrations

  frontend:

    build:
      context: ./frontend
      target: dev   # Vite dev server; the Dockerfile's final stage is the prod nginx build
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  pgdata:
